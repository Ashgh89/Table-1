<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Playstation release date</h2>
    <!-- Table -->
    <!-- data wie text, image, links -->
    <!-- tr -> Tabellenzeile (table-row) -->
    <!-- th -> table heading -->
    <!-- th -> makes your text bold and center -->
    <!-- td -> table-data -->

    <!-- EXAMPLE-1 -->
    <table>
      <tr>
        <th>PlayStation2</th>
        <th>PlayStation3</th>
        <th>PlayStation4</th>
        <th>PlayStation5</th>
      </tr>
      <tr>
        <td>2000</td>
        <td>2010</td>
        <td>2013</td>
        <td>2020</td>
      </tr>
    </table>

    <!-- EXAMPLE-2 -->
    <table>
      <thead>
        <tr>
          <th>Monat</th>
          <th>Sparen</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Jan</td>
          <td>100€</td>
        </tr>
        <tr>
          <td>Feb</td>
          <td>400€</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td>500€</td>
        </tr>
      </tfoot>
    </table>

    <!-- EXSAMPLE-3 -->
    <table style="width: 100%">
      <tr>
        <th colspan="2">Name</th>
        <th>City</th>
      </tr>
      <tr>
        <td>Michael</td>
        <td>Begler</td>
        <td>Köln</td>
      </tr>
      <tr>
        <td>Ash</td>
        <td>Ghanei</td>
        <td>Berlin</td>
      </tr>
      <tr>
        <td>David</td>
        <td>Müller</td>
        <td>Hamburg</td>
      </tr>
    </table>
  </body>
</html>
